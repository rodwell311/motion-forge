name: Render

on:
  workflow_dispatch:
    inputs:
      composition:
        description: 'Composition ID to render'
        required: true
        default: 'BrowserMotion'
  push:
    branches: [main]

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Validate timeline
        run: node scripts/validate-timeline.mjs

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Ensure Remotion browser
        run: npx remotion browser ensure

      - name: Render composition
        run: |
          COMP_ID="${{ inputs.composition || 'BrowserMotion' }}"
          echo "Rendering composition: $COMP_ID"
          npx remotion render src/index.tsx "$COMP_ID" "output/$COMP_ID.mp4" --codec=h264 --crf=18

      - name: Upload final video
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.composition || 'BrowserMotion' }}
          path: output/*.mp4
          retention-days: 7
