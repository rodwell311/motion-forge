name: Render

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Validate render script syntax
        run: node --check scripts/render.mjs

      - name: Validate timeline
        run: node scripts/render.mjs --validate-timeline

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg

      - name: Render motion graphic
        run: node scripts/render.mjs

      - name: Upload final video
        uses: actions/upload-artifact@v4
        with:
          name: dota-chronicle
          path: output/dota-chronicle.mp4
          retention-days: 7
