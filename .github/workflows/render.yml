name: Render

on:
  workflow_dispatch:
    inputs:
      title:
        description: 'Custom title text (optional)'
        required: false
        default: ''
        type: string

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Validate render script syntax
        run: node --check scripts/render.mjs

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg

      - name: Render motion graphic
        env:
          RENDER_TITLE: ${{ inputs.title }}
        run: node scripts/render.mjs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: motion-forge-output
          path: output/
          retention-days: 7
